<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#5b35f5"><meta name="description" content="Teacher Muli AI helps PP1 to Grade 9 learners understand homework, assignments, revision and learning topics.">
<title>Teacher Muli AI — Learn, Ask, Explain</title><link rel="manifest" href="/manifest.json">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f6ff;color:#17203a}button,input,textarea{font:inherit}header{padding:20px 18px;background:linear-gradient(135deg,#5b35f5,#7a43f6);color:#fff;border-radius:0 0 28px 28px}.brand{font-size:30px;font-weight:900}.tag{opacity:.92;margin-top:5px}.pass{float:right;background:#ffffff20;border:1px solid #ffffff45;color:#fff;border-radius:14px;padding:10px 14px;font-weight:800;cursor:pointer}main{max-width:900px;margin:auto;padding:18px}.status{background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 5px 18px #1a24520d;margin-bottom:16px}.status b{color:#d13b3b}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tool{border:0;background:#fff;border-radius:20px;padding:18px;text-align:left;box-shadow:0 7px 22px #18264b10;font-weight:800;font-size:16px;cursor:pointer;min-height:150px}.tool:active,.class:active,.btn:active{transform:scale(.99)}.tool span{font-size:28px;display:block;margin-bottom:8px}.tool small{display:block;color:#667085;font-weight:500;margin-top:5px}h2{margin-top:26px}.classes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.class{background:#fff;border:2px solid transparent;border-radius:20px;padding:16px;font-weight:900;font-size:18px;cursor:pointer}.class.active{border-color:#5b35f5}.class small{display:block;color:#6b7280;font-weight:500;margin-top:5px}.lock{margin-top:18px;background:#fff3cd;border:1px solid #f0d98c;border-radius:16px;padding:13px}.modal{position:fixed;inset:0;background:#10152688;display:none;align-items:flex-end;justify-content:center;z-index:10}.sheet{background:#fff;width:100%;max-width:700px;border-radius:26px 26px 0 0;padding:20px;max-height:90vh;overflow:auto}.close{float:right;border:0;background:#eee;border-radius:50%;width:38px;height:38px;font-size:20px;cursor:pointer}.row{display:flex;gap:10px;flex-wrap:wrap}.input,textarea{width:100%;padding:13px;border:1px solid #d7dce8;border-radius:14px}.btn{border:0;border-radius:13px;padding:12px 16px;font-weight:800;cursor:pointer;background:#5b35f5;color:#fff}.btn:disabled{opacity:.6;cursor:wait}.btn.secondary{background:#eef0f7;color:#222}.result{white-space:pre-wrap;background:#f7f8fc;border-radius:16px;padding:16px;margin-top:15px;line-height:1.55}.preview{max-width:100%;max-height:320px;object-fit:contain;border-radius:14px;margin-top:10px}.muted{color:#667085;font-size:13px}.footer{text-align:center;color:#667085;padding:25px}@media(max-width:650px){.tools{grid-template-columns:1fr 1fr}.brand{font-size:27px}.tool{min-height:145px}}
</style></head>
<body>
<header><button class="pass" onclick="openPass()">🔒 Learning Pass</button><div class="brand">Teacher Muli AI</div><div class="tag">Learn smarter from PP1 to Grade 9.</div></header>
<main>
<div class="status" id="status">Checking learning access…</div>
<section class="tools">
<button class="tool" onclick="openAsk()"><span>🔎</span>Search & Ask<small>Ask questions and get explanations</small></button>
<button class="tool" onclick="openTalk()"><span>🎤</span>Talk to Teacher Muli<small>Speak and hear your explanation</small></button>
<button class="tool" onclick="openPhoto()"><span>📷</span>Solve Homework Photo<small>Take or upload a question</small></button>
<button class="tool" onclick="openHomework()"><span>📝</span>Homework & Assignments<small>Understand and work through tasks</small></button>
<button class="tool" onclick="openRevision()"><span>📚</span>Notes & Revision<small>Create notes and download them</small></button>
<button class="tool" onclick="openQuiz()"><span>🧠</span>Quiz Practice<small>Practice at your class level</small></button>
</section>
<div class="lock" id="lock">🔒 Learning tools are available after your payment is approved.</div>
<h2>Choose your class</h2><div class="classes" id="classes"></div>
<div class="footer">KSh 10 • 24 hours after manual approval • Till 1610044<br>Support: 0707078236</div>
</main>
<div class="modal" id="modal"><div class="sheet"><button class="close" onclick="closeModal()">×</button><div id="sheet"></div></div></div>
<script>
const classes=['PP1','PP2',...Array.from({length:9},(_,i)=>'Grade '+(i+1))];
let selected=localStorage.getItem('tm_grade')||'PP1',approved=false,accessUntil=null,speechText='';
const qs=s=>document.querySelector(s);
function renderClasses(){qs('#classes').innerHTML=classes.map(c=>`<button class="class ${c===selected?'active':''}" onclick="selectClass('${c}')">${c}<small>${c.startsWith('PP')?'Early learning':'Primary & Junior Secondary'}</small></button>`).join('')}
function selectClass(c){selected=c;localStorage.setItem('tm_grade',c);renderClasses()}
function openModal(title,body){qs('#sheet').innerHTML=`<h2 style="margin-top:0">${title}</h2>${body}`;qs('#modal').style.display='flex'}
function closeModal(){qs('#modal').style.display='none'}
function requireAccess(fn){if(!approved){openPass();return}fn()}
function openPass(){openModal('🔐 Learning Pass',`<p>Pay <b>KSh 10</b> to Till <b>1610044</b>, then enter your M-Pesa transaction reference below.</p><input class="input" id="ref" placeholder="M-Pesa transaction reference" autocomplete="off"><br><br><button class="btn" id="paybtn" type="button" onclick="submitPayment()">Submit payment reference</button><div id="paymsg" class="result" style="display:none"></div><p class="muted">Access lasts exactly 24 hours after admin approval.</p>`)}
async function submitPayment(){const input=qs('#ref'),btn=qs('#paybtn'),msg=qs('#paymsg');const reference=(input?.value||'').trim();if(!reference){msg.style.display='block';msg.innerHTML='⚠️ Please enter the M-Pesa transaction reference.';return}btn.disabled=true;btn.textContent='Sending…';msg.style.display='block';msg.innerHTML='Sending your payment reference securely…';try{const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),15000);let r;try{r=await fetch('/api/payment',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify({reference}),signal:controller.signal})}finally{clearTimeout(timer)}let x=await r.json().catch(()=>({}));if(!r.ok){const detail=x.detail?.message||x.detail?.details||x.detail||'';const text=x.error==='duplicate_reference'?'⚠️ That transaction reference has already been submitted.':x.code==='SUPABASE_TIMEOUT'?'⚠️ The payment server could not reach the database in time. Please try again.':(x.error||'Payment request failed.')+(detail?' — '+String(detail):'');msg.innerHTML=escapeHtml(text);btn.disabled=false;btn.textContent='Submit payment reference';return}msg.innerHTML='✅ Payment reference submitted. Please wait for manual admin approval.';btn.textContent='Submitted';setTimeout(()=>{closeModal();checkAccess()},900)}catch(e){msg.innerHTML=e?.name==='AbortError'?'⚠️ The server took too long to respond. Please try again.':'⚠️ Could not connect to the server. Please try again.';btn.disabled=false;btn.textContent='Submit payment reference'}}
async function checkAccess(){try{const r=await fetch('/api/access',{credentials:'same-origin',cache:'no-store'});const x=await r.json().catch(()=>({}));approved=!!(r.ok&&x.approved===true&&x.status==='APPROVED'&&x.accessUntil&&new Date(x.accessUntil)>new Date());accessUntil=x.accessUntil||null;const pending=x.status==='PAYMENT_PENDING';qs('#status').innerHTML=approved?`<b style="color:#087443">✓ Learning access approved</b> • Expires ${new Date(accessUntil).toLocaleString()}`:pending?`<b style="color:#9a6700">⏳ Payment submitted</b> • Waiting for admin approval`:x.error?`<b>⚠️ Access check unavailable</b> • Please try again`:`<b>🔒 Learning locked</b> • Submit payment and wait for manual approval`;qs('#lock').style.display=approved?'none':'block'}catch(e){approved=false;accessUntil=null;qs('#status').innerHTML='<b>⚠️ Connection problem</b> • Try again';qs('#lock').style.display='block'}}
function openAsk(){requireAccess(()=>openModal('🔎 Search & Ask',`<p>Selected class: <b>${escapeHtml(selected)}</b></p><textarea id="q" rows="5" placeholder="Ask Teacher Muli anything you are learning…"></textarea><br><br><button class="btn" onclick="askAI('question')">Ask Teacher Muli</button><div id="out"></div>`))}
function openHomework(){requireAccess(()=>openModal('📝 Homework & Assignments',`<p>Tell Teacher Muli what the assignment asks. You will get a clear explanation and worked steps.</p><textarea id="q" rows="6" placeholder="Paste or type the homework question…"></textarea><br><br><button class="btn" onclick="askAI('homework')">Help me solve it</button><div id="out"></div>`))}
function openRevision(){requireAccess(()=>openModal('📚 Notes & Revision',`<p>Search a topic and create class-level notes.</p><input class="input" id="q" placeholder="e.g. Fractions, photosynthesis, nouns"><br><br><button class="btn" onclick="askAI('notes')">Create notes</button><div id="out"></div>`))}
function openQuiz(){requireAccess(()=>openModal('🧠 Quiz Practice',`<p>Enter a topic and Teacher Muli will create practice questions.</p><input class="input" id="q" placeholder="Topic"><br><br><button class="btn" onclick="askAI('quiz')">Create quiz</button><div id="out"></div>`))}
function openTalk(){requireAccess(()=>openModal('🎤 Talk to Teacher Muli',`<p>Tap the microphone and speak your question.</p><button class="btn" onclick="startSpeech()">🎙 Start speaking</button><div id="speech" class="result">Ready.</div><button class="btn secondary" onclick="askFromSpeech()">Ask Teacher Muli</button><div id="out"></div>`))}
function startSpeech(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){qs('#speech').textContent='Voice input is not supported by this browser. Use Search & Ask instead.';return}speechText='';const r=new R();r.lang='en-KE';r.interimResults=false;r.maxAlternatives=1;r.onresult=e=>{speechText=e.results[0][0].transcript;qs('#speech').textContent='You said: '+speechText};r.onerror=e=>qs('#speech').textContent='Voice input error: '+(e.error||'try again');r.start()}
function askFromSpeech(){if(!speechText){qs('#speech').textContent='Please tap Start speaking and ask a question first.';return}askAIWithText('question',speechText,true)}
function openPhoto(){requireAccess(()=>openModal('📷 Solve Homework Photo',`<p>Take a clear photo or choose one from your phone.</p><input class="input" id="photo" type="file" accept="image/*" capture="environment" onchange="previewPhoto(event)"><img id="pic" class="preview" alt="Homework preview"><br><br><textarea id="q" rows="3" placeholder="Optional: tell Teacher Muli what you want explained"></textarea><br><button class="btn" onclick="photoHelp()">Read & solve photo</button><div id="out"></div>`))}
function previewPhoto(e){const f=e.target.files[0];if(f)qs('#pic').src=URL.createObjectURL(f)}
async function photoHelp(){const f=qs('#photo')?.files?.[0],out=qs('#out');if(!f){out.innerHTML='<div class=result>⚠️ Take or choose a photo first.</div>';return}if(f.size>7*1024*1024){out.innerHTML='<div class=result>⚠️ Please choose a photo smaller than 7 MB.</div>';return}out.innerHTML='<div class=result>📷 Teacher Muli is reading the photo…</div>';const fd=new FormData();fd.append('image',f);fd.append('question',qs('#q')?.value||'');fd.append('grade',selected);try{const r=await fetch('/api/ask',{method:'POST',body:fd,credentials:'same-origin'}),x=await r.json().catch(()=>({}));if(!r.ok){out.innerHTML='<div class=result>⚠️ '+escapeHtml(x.error||'Unable to read the photo right now.')+'</div>';return}showAnswer(out,x.answer||'No answer returned.',true)}catch(e){out.innerHTML='<div class=result>⚠️ Could not connect to Teacher Muli. Please try again.</div>'}}
async function askAI(kind){askAIWithText(kind,qs('#q')?.value||'',kind==='question'&&false)}
async function askAIWithText(kind,text,speak=false){text=String(text||'').trim();const out=qs('#out');if(!text){if(out)out.innerHTML='<div class=result>⚠️ Enter a question or topic first.</div>';return}out.innerHTML='<div class=result>Teacher Muli is thinking…</div>';try{const r=await fetch('/api/ask',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify({grade:selected,kind,question:text})}),x=await r.json().catch(()=>({}));if(!r.ok){out.innerHTML='<div class=result>⚠️ '+escapeHtml(x.error||'Teacher Muli could not answer right now.')+'</div>';return}showAnswer(out,x.answer||'No answer returned.',speak)}catch(e){out.innerHTML='<div class=result>⚠️ Could not connect to Teacher Muli. Please try again.</div>'}}
function showAnswer(out,answer,speak){out.innerHTML=`<div class=result>${escapeHtml(answer)}</div><div class="row" style="margin-top:10px"><button class="btn secondary" onclick="downloadText('Teacher-Muli-${selected}',${JSON.stringify(answer)})">📥 Download</button><button class="btn secondary" onclick="printAnswer('Teacher Muli - ${selected}',${JSON.stringify(answer)})">🖨 Save / Print PDF</button>${speak?'<button class="btn secondary" onclick="speakAnswer('+JSON.stringify(answer)+')">🔊 Read aloud</button>':''}</div>`;if(speak)speakAnswer(answer)}
function speakAnswer(text){if(!('speechSynthesis' in window)){alert('Voice playback is not supported by this browser.');return}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text));u.lang='en-KE';window.speechSynthesis.speak(u)}
function downloadText(title,text){const blob=new Blob([String(text)],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=title.replace(/[^a-z0-9]+/gi,'-')+'.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function printAnswer(title,text){const html='<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+escapeHtml(title)+'</title><style>body{font-family:system-ui;max-width:800px;margin:30px auto;padding:20px;line-height:1.6}h1{font-size:24px}pre{white-space:pre-wrap;font:inherit}</style></head><body><h1>'+escapeHtml(title)+'</h1><pre>'+escapeHtml(text)+'</pre></body></html>';const blob=new Blob([html],{type:'text/html'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=title.replace(/[^a-z0-9]+/gi,'-')+'.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
renderClasses();checkAccess();setInterval(checkAccess,30000);
</script></body></html>
